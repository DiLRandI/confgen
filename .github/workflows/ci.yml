name: Go checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check generated examples
        run: |
          go generate ./...
          test -z "$(git status --porcelain -- examples)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Check 32-bit integer limits
        env:
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: go test ./config ./schema ./internal/value
      - name: Fuzz smoke checks
        run: |
          go test ./schema -run '^$' -fuzz '^FuzzCompile$' -fuzztime=5s -parallel=2
          go test ./config -run '^$' -fuzz '^FuzzSources$' -fuzztime=5s -parallel=2
          go test ./internal/value -run '^$' -fuzz '^FuzzScalarText$' -fuzztime=5s -parallel=2
      - name: Benchmark smoke check
        run: go test ./config ./schema ./generator -run '^$' -bench . -benchmem -benchtime=100ms
