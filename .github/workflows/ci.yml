name: Go checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', 'stable']
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: |
            go.sum
            examples/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check module metadata
        run: |
          go mod tidy
          go -C examples mod tidy
          git diff --exit-code -- go.mod go.sum examples/go.mod examples/go.sum
      - name: Test this revision with the consumer module
        run: |
          task_workspace=$(mktemp -d)
          (cd "$task_workspace" && go work init "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/examples")
          echo "GOWORK=$task_workspace/go.work" >> "$GITHUB_ENV"
      - name: Check generated examples
        run: |
          go -C examples generate ./...
          test -z "$(git status --porcelain -- examples)"
      - name: Check reachable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - run: go vet ./...
      - run: go -C examples vet ./...
      - run: go test ./...
      - run: go -C examples test ./...
      - run: go test -race ./...
      - run: go -C examples test -race ./...
      - name: Run consumer example
        env:
          DATABASE_URL: postgres://localhost/shop
          SHOP_SERVER_PORT: '10000'
        run: go -C examples run .
      - name: Check 32-bit integer limits
        env:
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: go test ./config ./schema ./internal/value
      - name: Fuzz smoke checks
        run: |
          go test ./schema -run '^$' -fuzz '^FuzzCompile$' -fuzztime=5s -parallel=2
          go test ./config -run '^$' -fuzz '^FuzzSources$' -fuzztime=5s -parallel=2
          go test ./internal/value -run '^$' -fuzz '^FuzzScalarText$' -fuzztime=5s -parallel=2
          go test ./infer -run '^$' -fuzz '^FuzzFromConfig$' -fuzztime=5s -parallel=2
      - name: Benchmark smoke check
        run: go test ./config ./schema ./generator ./infer -run '^$' -bench . -benchmem -benchtime=100ms
